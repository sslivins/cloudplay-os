name: Attach an existing preview to a draft beta
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful image build run ID
        required: true
        type: string
      source_commit:
        description: Exact image source commit (40 lowercase hex characters)
        required: true
        type: string
      tag:
        description: Existing beta tag and draft prerelease
        required: true
        type: string
      image_sha256:
        description: Independently reviewed compressed image SHA-256
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: cloudplay-promote-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  attach:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.tag }}
      IMAGE_SHA256: ${{ inputs.image_sha256 }}
    steps:
      - name: Validate source build and unpublished beta target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          gh run view "$RUN_ID" --json conclusion,headSha > run.json
          jq -e --arg sha "$SOURCE_COMMIT" \
            '.conclusion == "success" and .headSha == $sha' run.json
          [[ "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" == "$SOURCE_COMMIT" ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > release.json
          jq -e '.isDraft == true and .isPrerelease == true' release.json
      - name: Download the original image artifact without rebuilding
        run: |
          gh run download "$RUN_ID" \
            --name "cloudplay-os-kiosk-preview-$SOURCE_COMMIT" --dir image
      - name: Check provenance and attach the reviewed image
        working-directory: image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(cat provenance/cloudplay-commit.txt)" == "$SOURCE_COMMIT" ]]
          sha256sum --check SHA256SUMS
          shopt -s nullglob
          images=(image_*.img.xz)
          [[ ${#images[@]} == 1 ]]
          printf '%s  %s\n' "$IMAGE_SHA256" "${images[0]}" | sha256sum --check -
          [[ "${images[0]}" =~ ^image_[0-9A-Za-z._-]+\.img\.xz$ ]]
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          asset_name="${images[0]}"
          expected_digest="sha256:$IMAGE_SHA256"
          reconcile_asset() {
            gh api "repos/$GH_REPO/releases/$release_id/assets" --paginate > release-assets.json
            matches="$(jq --arg name "$asset_name" '[.[] | select(.name == $name)]' release-assets.json)"
            [[ "$(jq length <<<"$matches")" -le 1 ]]
            if jq -e --arg digest "$expected_digest" \
                '.[0].state == "uploaded" and .[0].digest == $digest' <<<"$matches" >/dev/null; then
              return 0
            fi
            if jq -e '.[0].state == "uploaded"' <<<"$matches" >/dev/null; then
              echo "Existing uploaded asset has the wrong digest" >&2
              return 2
            fi
            starter_id="$(jq -r '.[0] | select(.state == "starter") | .id // empty' <<<"$matches")"
            if [[ -n "$starter_id" ]]; then
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$starter_id"
            fi
            return 1
          }
          # GitHub can return transient failures after receiving part of a
          # large asset. Retry the GitHub CLI from a clean server-side state,
          # never overwrite an uploaded asset, and require its computed digest.
          for attempt in 1 2 3 4 5 6; do
            if reconcile_asset; then exit 0; else result=$?; fi
            [[ "$result" -eq 1 ]]
            echo "Image upload attempt $attempt of 6"
            if timeout --kill-after=30 20m \
                gh release upload "$RELEASE_TAG" "$asset_name"; then
              if reconcile_asset; then exit 0; else result=$?; fi
              [[ "$result" -eq 1 ]]
            fi
            if reconcile_asset; then exit 0; else result=$?; fi
            [[ "$result" -eq 1 ]]
            sleep $((attempt * 10))
          done
          echo "GitHub CLI image upload failed after 6 bounded attempts" >&2
          exit 1
