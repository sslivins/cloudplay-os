name: Small checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/artifacts.py validate --allow-unset
      - run: node --check onboarding/setup.js
      - name: Shell syntax
        run: |
          find scripts stage-cloudplay -type f \( -name '*.sh' -o -name 'cloudplay-start' -o -name 'cloudplay-session' -o -name 'cloudplay-browser-session' -o -name 'labwc-autostart' \) -print0 |
            xargs -0 -r -n1 bash -n
          bash -n config
          bash -n stage-cloudplay/00-appliance/files/cloudplay-development-ssh
