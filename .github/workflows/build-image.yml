name: Build unsigned ARM64 kiosk preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudplay-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail before spending build time if pins are unfinished
        run: |
          python3 scripts/artifacts.py validate
          python3 -m unittest discover -s tests -v
      - name: Install pi-gen host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test bmap-tools kmod minisign zstd gdisk cloud-guest-utils mtools
      - name: Build (native ARM64, privileged dedicated runner)
        run: sudo bash scripts/build-image.sh
      - name: Retain pi-gen log even when the build fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudplay-build-log-${{ github.sha }}
          path: build/pi-gen/work/*/build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain preview image and provenance (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudplay-os-kiosk-preview-${{ github.sha }}
          path: build/pi-gen/deploy/
          if-no-files-found: error
          retention-days: 7
